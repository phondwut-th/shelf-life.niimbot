<meta name="claude:viewport-fit-sides" content="cover">
<title>วัตถุดิบ KACHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* layout: แอปหลังบ้านแบบแท็บ — มือถือใช้แถบแท็บล่าง, จอใหญ่ใช้แท็บบนหัว · สรุปก่อน รายละเอียดทีหลัง
     ใช้โทนเดียวกับแอปกองกลาง (กระดาษ + เขียวชา) เพิ่มสีสถานะ: แดง=หมด/ค้างจ่าย, อำพัน=ใกล้สั่ง */
  :root {
    --paper: #f7f6f1; --card: #ffffff; --ink: #1f251e; --muted: #687064; --line: #e4e2d8; --soft: #f0efe8;
    --tea: #1f7a54; --tea-soft: #e2efe6; --out: #b4472e; --out-soft: #f6e5df;
    --warn: #9a6408; --warn-soft: #f6ecd4; --info: #2d5f8a; --info-soft: #e3ecf4;
    --shadow: 0 1px 2px rgba(20,30,20,.05);
    --sans: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #13130f; --card: #1c1c17; --ink: #ebe8dd; --muted: #9c9d90; --line: #313028; --soft: #24241d;
      --tea: #52c08b; --tea-soft: #1a2c22; --out: #e57f66; --out-soft: #2e1f1a; --warn: #e3b25a; --warn-soft: #2e2615;
      --info: #7fb2e0; --info-soft: #1a2633; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #13130f; --card: #1c1c17; --ink: #ebe8dd; --muted: #9c9d90; --line: #313028; --soft: #24241d;
    --tea: #52c08b; --tea-soft: #1a2c22; --out: #e57f66; --out-soft: #2e1f1a; --warn: #e3b25a; --warn-soft: #2e2615;
    --info: #7fb2e0; --info-soft: #1a2633; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--paper); }
  body { margin: 0; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body.noscroll { overflow: hidden; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--tea); outline-offset: 2px; }

  /* ---- หัว + แท็บ ---- */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
  .brand { font-weight: 700; letter-spacing: .6px; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand small { font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .topnav { display: none; gap: 4px; margin-left: 12px; }
  .topnav a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 999px; font-weight: 500; font-size: 14px; position: relative; }
  .topnav a.on { background: var(--tea-soft); color: var(--tea); }
  .spacer { flex: 1; }
  .iconbtn { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--out); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-family: var(--mono); margin-left: 4px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar a { text-decoration: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 2px 7px; font-size: 11.5px; font-weight: 500; position: relative; }
  .tabbar a .ic { font-size: 19px; line-height: 1.1; filter: grayscale(1); opacity: .75; }
  .tabbar a.on { color: var(--tea); }
  .tabbar a.on .ic { filter: none; opacity: 1; }
  .tabbar .badge { position: absolute; top: 3px; left: 54%; }
  @media (min-width: 860px) { .topnav { display: flex; } .tabbar { display: none; } }

  .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 860px) { .wrap { padding-block: 22px 56px; } }
  .view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  h2 { font-size: 20px; margin: 0; letter-spacing: .2px; text-wrap: balance; }
  h3 { font-size: 15.5px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .between { justify-content: space-between; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card > h3 { margin-bottom: 10px; }
  .grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } }

  /* ---- ตัวเลขสรุป ---- */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 860px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .kpi .k { font-size: 12.5px; color: var(--muted); }
  .kpi .v { font-family: var(--mono); font-size: clamp(22px, 6vw, 28px); font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  .kpi.red .v { color: var(--out); } .kpi.amber .v { color: var(--warn); } .kpi.green .v { color: var(--tea); }

  /* ---- ชิปสถานะ ---- */
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--soft); color: var(--muted); }
  .chip.red { background: var(--out-soft); color: var(--out); }
  .chip.amber { background: var(--warn-soft); color: var(--warn); }
  .chip.green { background: var(--tea-soft); color: var(--tea); }
  .chip.blue { background: var(--info-soft); color: var(--info); }
  .tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 6px; border: 1px dashed var(--warn); color: var(--warn); white-space: nowrap; }

  /* ---- ปุ่ม ---- */
  .btn { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; background: var(--tea); color: #fff; min-height: 44px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .btn.red { background: var(--out); }
  .btn.sm { padding: 6px 12px; min-height: 34px; font-size: 13px; border-radius: 10px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn:active { transform: translateY(1px); }
  .linkbtn { border: none; background: none; color: var(--tea); cursor: pointer; padding: 4px 0; font-weight: 500; font-size: 13px; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: none; background: transparent; padding: 6px 12px; border-radius: 9px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .chips button.on { border-color: var(--tea); background: var(--tea-soft); color: var(--tea); font-weight: 600; }

  /* ---- ฟอร์ม ---- */
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); width: 100%; min-height: 44px; font-size: 16px; color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--tea); outline-offset: -1px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fgrid .full { grid-column: 1 / -1; }
  @media (max-width: 420px) { .fgrid { grid-template-columns: 1fr; } }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--tea); }
  .hint { font-size: 12px; color: var(--muted); }
  .pick { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; color: var(--ink); font-size: 14px; background: var(--paper); }
  .pick input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

  /* ---- ตาราง / รายการ ---- */
  .tbl-wrap { overflow-x: auto; margin: 0 -4px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { min-width: 132px; }
  td.r, th.r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 600; border-bottom: none; }
  .list { display: flex; flex-direction: column; }
  .li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); align-items: center; }
  .li:last-child { border-bottom: none; }
  .li .nm { font-weight: 500; overflow-wrap: anywhere; }
  .li .mt { font-size: 12.5px; color: var(--muted); }
  .li .rt { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .li.tap { cursor: pointer; } .li.tap:hover { background: var(--soft); }
  .empty { text-align: center; color: var(--muted); padding: 26px 12px; font-size: 14px; }
  .empty b { display: block; color: var(--ink); margin-bottom: 4px; }

  /* ---- สต็อก ---- */
  .stock-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
  .stock-row:hover { background: var(--soft); }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--tea); }
  .bar i.amber { background: var(--warn); } .bar i.red { background: var(--out); }
  .qty { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .qty small { font-weight: 400; color: var(--muted); }
  .cat-h { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .5px; padding: 14px 2px 2px; }

  /* ---- บิล ---- */
  .bill { border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; }
  .bill-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 16px; cursor: pointer; }
  .bill-h .amt { font-family: var(--mono); font-weight: 600; font-size: 18px; text-align: right; white-space: nowrap; }
  .bill-b { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .bill.paid .bill-h .amt { color: var(--muted); }
  .pay { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--card); }
  .pdf { width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; color: var(--muted); text-decoration: none; background: var(--card); }
  .add-slip { display: inline-flex; align-items: center; height: 64px; padding: 0 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .add-slip:hover { color: var(--tea); border-color: var(--tea); }
  .warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .round-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .round-sum > div { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--card); min-width: 0; }
  .round-sum span { font-size: 12px; color: var(--muted); display: block; }
  .round-sum b { font-family: var(--mono); font-size: 17px; }

  /* ---- ยอดขาย ---- */
  .menu-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .step { display: flex; align-items: center; gap: 4px; }
  .step button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-size: 20px; cursor: pointer; color: var(--ink); }
  .step input { width: 68px; text-align: center; font-family: var(--mono); padding: 8px 4px; }
  .grade { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--muted); margin-right: 6px; font-family: var(--mono); }
  .grade.A { background: var(--tea-soft); color: var(--tea); } .grade.B { background: var(--info-soft); color: var(--info); }
  .grade.C { background: var(--warn-soft); color: var(--warn); }
  .sticky-save { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); background: var(--card); padding: 10px 0 2px; display: flex; gap: 10px; align-items: center; }
  @media (min-width: 860px) { .sticky-save { bottom: 0; } }

  /* ---- sheet (ฟอร์มลอย) ---- */
  .sheet { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,10,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-in { background: var(--card); width: 100%; max-width: 620px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow: auto; border-radius: 18px 18px 0 0;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
  @media (min-width: 700px) { .sheet { align-items: center; } .sheet-in { border-radius: 18px; max-height: 90%; padding: 20px 22px; } }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: -16px; background: var(--card); padding-top: 2px; z-index: 1; }
  .sheet-h h3 { font-size: 17px; }
  .x { border: none; background: var(--soft); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px; color: var(--muted); flex-shrink: 0; }
  .line-ed { display: grid; grid-template-columns: minmax(0, 1fr) 76px 92px 36px; gap: 6px; align-items: end; }
  .line-ed .x { width: 36px; height: 44px; border-radius: 10px; }
  @media (max-width: 480px) { .line-ed { grid-template-columns: 1fr 1fr 36px; } .line-ed .li-item { grid-column: 1 / -1; } }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions .btn { flex: 1; }

  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; cursor: zoom-out;
    padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
    background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .banner { background: var(--out-soft); color: var(--out); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
  .note { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">KACHA <small>วัตถุดิบ · สต็อก · บิล</small></div>
    <nav class="topnav" id="topnav"></nav>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" type="button">โหมดสี</button>
  </div>
</header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-stock" hidden></section>
  <section class="view" id="v-buy" hidden></section>
  <section class="view" id="v-bills" hidden></section>
  <section class="view" id="v-sales" hidden></section>
</main>

<nav class="tabbar" id="tabbar"></nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h"><h3 id="sheetTitle"></h3><button class="x" id="sheetX" type="button" aria-label="ปิด">✕</button></div>
    <div id="sheetBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="หลักฐานการจ่ายเงิน"></div>
<input type="file" id="addSlipIn" accept="image/*,application/pdf" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function copy(o) { var r = {}; if (o) for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = o[k]; return r; }
  function deep(o) { return JSON.parse(JSON.stringify(o == null ? null : o)); }
  function num(v) { var n = Number(String(v == null ? "" : v).replace(/,/g, "").trim()); return isFinite(n) ? n : NaN; }
  function fmt(n, d) { if (n == null || !isFinite(n)) return "–"; return Number(n).toLocaleString("th-TH", { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: 0 }); }
  function baht(n) { return n == null || !isFinite(n) ? "–" : "฿" + fmt(n, Math.abs(n) < 100 && n % 1 ? 2 : 0); }
  function today() { return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" }); }
  function nowTime() { return new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit" }); }
  function addDays(iso, n) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

  var toastT = null;
  function toast(msg, ms) { var el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, ms || 2200); }
  function banner(msg) { var b = $("banner"); b.textContent = msg; b.hidden = !msg; }
  function writeErr(err) {
    var c = err && err.code;
    if (!C.bills) { banner("ยังเชื่อมต่อฐานข้อมูลไม่ได้ เปิดหน้านี้ผ่าน claude.ai และล็อกอินก่อน"); return; }
    banner(c === "not_granted" || c === "invalid_argument" ? "บัญชีนี้ไม่มีสิทธิ์แก้ข้อมูล ขอสิทธิ์แก้ไขจากเจ้าของแอป" :
      c === "too_large" ? "ไฟล์ใหญ่เกินไป (เกิน 20MB)" : c === "unsupported_type" ? "ชนิดไฟล์ไม่รองรับ ใช้รูปหรือ PDF" : "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
    try { console.error(err); } catch (e) {}
  }

  // ---------- theme ----------
  try { var th = localStorage.getItem("kacha-stock-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  $("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme"), dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = cur ? (cur === "dark" ? "light" : "dark") : (dark ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("kacha-stock-theme", next); } catch (e) {}
  });

  // ---------- เชื่อม db ----------
  function snapDocs(snap) { return snap.docs.map(function (d) { var o = copy(d.data()); o.id = d.id; return o; }); }
  var renderT = null;
  // ข้อมูลเปลี่ยน → วาดใหม่ แต่ถ้ากำลังพิมพ์อยู่ในหน้านั้น อัปเดตแค่แถบแท็บ (ไม่ล้างช่องที่กรอกค้าง)
  function soon() {
    clearTimeout(renderT);
    renderT = setTimeout(function () {
      var a = document.activeElement, typing = a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $("v-" + view).contains(a) && a.type !== "search";
      if (typing) { compute(); renderNav(); } else render();
    }, 30);
  }
  function connect() {
    if (!window.claude || !window.claude.use) { connErr = "เปิดหน้านี้ผ่าน claude.ai เพื่อบันทึกข้อมูล (ตอนนี้แสดงแค่การคำนวณจากแผน)"; for (var k in loaded) loaded[k] = true; render(); return; }
    var slow = setTimeout(function () { if (!allLoaded()) { connErr = "ยังโหลดข้อมูลไม่ได้ ลองรีเฟรช หรือเช็กว่าล็อกอิน claude.ai แล้ว"; render(); } }, 10000);
    window.claude.use("db").then(function (db) {
      if (!db) { clearTimeout(slow); connErr = "เชื่อมฐานข้อมูลไม่ได้ (ต้องล็อกอิน claude.ai) · ตอนนี้แสดงแค่การคำนวณจากแผน"; for (var k in loaded) loaded[k] = true; render(); return; }
      dbNS = db;
      C = { bills: db.collection("bills"), moves: db.collection("moves"), sales: db.collection("sales"), settings: db.collection("settings") };
      function onErr(name) { return function (e) { clearTimeout(slow); loaded[name] = true; connErr = "อ่านข้อมูลไม่สำเร็จ (" + (e && e.code || "error") + ")"; render(); }; }
      C.bills.onSnapshot(function (s) { bills = snapDocs(s); loaded.bills = true; soon(); }, onErr("bills"));
      C.moves.onSnapshot(function (s) { moves = snapDocs(s); loaded.moves = true; soon(); }, onErr("moves"));
      C.sales.onSnapshot(function (s) { var o = {}; snapDocs(s).forEach(function (d) { o[d.id] = d; }); sales = o; loaded.sales = true; soon(); }, onErr("sales"));
      C.settings.onSnapshot(function (s) { var p = null; snapDocs(s).forEach(function (d) { if (d.id === "plan") p = d; }); planDoc = p || {}; loaded.settings = true; if (allLoaded()) { clearTimeout(slow); connErr = null; } soon(); }, onErr("settings"));
    }).catch(function () { clearTimeout(slow); connErr = "เชื่อมฐานข้อมูลไม่ได้"; for (var k in loaded) loaded[k] = true; render(); });
    window.claude.use("assets").then(function (a) { assetsNS = a || null; if (SH) render(); }).catch(function () {});
  }

  loadShared().then(function () { route(); connect(); }).catch(function (e) {
    banner("โหลดข้อมูลกลางของร้าน (shared/*.json) ไม่ได้ · " + (e && e.message || ""));
  });
})();
</script>
